name: Bug report
description: Something in Scribe does not behave the way it is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [open issues](https://github.com/Familis-co/scribe/issues) first — someone may already have hit this.

        **Do not attach real documents.** Issues are public. Reproduce with a synthetic PDF, or describe the document's layout instead.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@familis/scribe (pipeline, profiles, validation)"
        - "@familis/scribe/testing (adapter contract checks)"
        - "@familis/scribe-pdfium (PDFium adapter)"
        - "@familis/scribe-tesseract (Tesseract.js adapter)"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Include the error `code` when one was thrown.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest profile and `parse` call that show the problem.
      render: ts
    validations:
      required: true

  - type: dropdown
    id: document
    attributes:
      label: Document type
      options:
        - Native text PDF
        - Scanned PDF (image only)
        - Mixed native and scanned pages
        - Encrypted PDF
        - Not document-specific
    validations:
      required: true

  - type: dropdown
    id: ocr-mode
    attributes:
      label: OCR mode
      options:
        - auto
        - always
        - never
        - Not applicable

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: The `pages` and `diagnostics` arrays from the result, or `missingPaths` (`ExtractionError`) or `issues` (`ValidationError`) from the thrown error. Redact extracted values that are sensitive.
      render: json

  - type: input
    id: version
    attributes:
      label: Scribe version
      description: Scribe packages are versioned together.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node or Bun version, and the operating system.
      placeholder: Node 24.3.0 on Debian 13
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stack traces, including any `cause`. Redact anything sensitive.
      render: shell
