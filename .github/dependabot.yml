version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    groups:
      # One pull request for the whole workspace. A separate pull request per
      # package rewrites pnpm-lock.yaml, so they all conflict with each other
      # the moment one of them lands.
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    # A bare "/" only scans .github/workflows, which would leave the versions
    # pinned inside the composite action unwatched.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
