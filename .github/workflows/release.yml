name: Release

on:
  push:
    branches: [main]

# Every job below asks for exactly the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Cancelling a run halfway through publishing would leave npm, the Git tags
  # and GitHub Packages out of step.
  cancel-in-progress: false

env:
  LEFTHOOK: "0"

jobs:
  # Nothing is versioned or published from a commit that does not pass the same
  # checks a pull request has to pass.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  select-mode:
    name: Select mode
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release jobs run on Node 24 because npm trusted publishing needs npm
      # 11.5.1 or later, and they skip the dependency cache so a poisoned cache
      # entry cannot reach a published tarball.
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          cache: ""

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version pull request
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24
          cache: ""

      # Commits through the GitHub API, so no git credentials are needed on disk.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"

  pack:
    name: Pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24
          cache: ""

      - name: Build
        run: pnpm run build

      # The tarballs packed here are the exact bytes published to npm and
      # mirrored to GitHub Packages.
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  npm:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/familis
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      # Creates the Git tags and GitHub releases.
      contents: write
      # The OIDC token authenticates the publish through npm trusted publishing
      # and lets the registry attach a provenance statement. The trusted
      # publisher on npmjs.com names this file and the `npm` environment, so
      # renaming either breaks publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24
          cache: ""

      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  github-packages:
    name: Publish to GitHub Packages
    needs: [pack, npm]
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The mirror script only needs Node and npm, not the workspace.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/packed

      - name: Mirror the npm tarballs
        run: node scripts/publish-github-packages.mjs "$RUNNER_TEMP/packed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
